name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the source repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Java Development Kit (JDK 17 Eclipse Temurin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up pnpm package manager matching .mise.toml (10.34.3)
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      # Step 4: Set up Node.js 22 LTS with pnpm store caching
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Step 5: Install project dependencies using deterministic lockfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 6: Compile production web application via Vite into dist/
      - name: Build Web Application
        run: pnpm run build

      # Step 7: Verify web compilation output integrity
      - name: Verify Web Assets
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Web build failed: dist/index.html not found!"
            exit 1
          fi
          echo "Web build verified successfully. Asset count: $(ls -1 dist | wc -l)"

      # Step 8: Initialize or synchronize Capacitor Android platform
      - name: Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android native directory not found in repository. Initializing Capacitor Android..."
            npx cap add android
          else
            echo "Existing Android native directory detected."
          fi
          echo "Synchronizing web assets to Android platform..."
          npx cap sync android

      # Step 9: Configure Gradle caching and wrapper validation
      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # Step 10: Grant executable permissions to Gradle wrapper
      - name: Ensure Gradle Wrapper Executable
        run: chmod +x android/gradlew

      # Step 11: Compile Debug APK (immediately installable on student devices)
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      # Step 12: Compile Release APK
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      # Step 13: Sign Release APK (Graceful step: executed only if keystore secret exists)
      - name: Sign Release APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Signing secrets detected. Decoding keystore..."
            RUNNER_TEMP_KS="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP_KS"
            
            UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*release*.apk" | head -n 1)
            if [ -n "$UNSIGNED_APK" ]; then
              SIGNED_APK="android/app/build/outputs/apk/release/app-release-signed.apk"
              echo "Signing $UNSIGNED_APK with apksigner..."
              
              # Locate latest apksigner in pre-installed Android SDK build-tools
              APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
              
              $APKSIGNER sign \
                --ks "$RUNNER_TEMP_KS" \
                --ks-pass pass:"$KEYSTORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass pass:"${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                --out "$SIGNED_APK" \
                "$UNSIGNED_APK"
                
              echo "Signed release APK generated at: $SIGNED_APK"
              echo "signed=true" >> $GITHUB_OUTPUT
            fi
            rm -f "$RUNNER_TEMP_KS"
          else
            echo "Release signing secrets not configured. Preserving unsigned release APK."
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      # Step 14: Inspect generated binaries and construct GitHub Step Summary
      - name: Generate Build Summary
        if: always()
        run: |
          echo "### 📱 Android APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Path | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "android/app/build/outputs/apk" ]; then
            find android/app/build/outputs/apk -name "*.apk" | while read -r apk_path; do
              file_name=$(basename "$apk_path")
              file_size=$(ls -lh "$apk_path" | awk '{print $5}')
              sha256=$(sha256sum "$apk_path" | awk '{print $1}')
              echo "| **$file_name** | \`$apk_path\` | $file_size | \`${sha256:0:16}...\` |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "| None | \`android/app/build/outputs/apk\` not created | 0 | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Installation Instructions for Students:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download \`timacad-student-apk.zip\` from the Artifacts section below." >> $GITHUB_STEP_SUMMARY
          echo "2. Unzip and transfer \`app-debug.apk\` to your Android phone." >> $GITHUB_STEP_SUMMARY
          echo "3. Open the file on your device and permit 'Install from unknown sources' to install." >> $GITHUB_STEP_SUMMARY

      # Step 15: Upload APK artifacts for download
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timacad-student-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
