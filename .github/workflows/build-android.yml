name: Android verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: chmod +x android/gradlew
      - run: pnpm run build:android:debug
      - uses: actions/upload-artifact@v4
        with:
          name: tim-campus-development-apk
          path: releases/*-debug.apk
          if-no-files-found: error
          retention-days: 7
      # Public signed releases are built by scripts/build-android.mjs with the
      # project's protected signing key, verified, and published separately.
