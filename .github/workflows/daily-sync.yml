name: Official schedule synchronization
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: schedule-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and validate official current schedules
        run: node scripts/sync-schedule.mjs
      - name: Verify data contracts
        run: node --test tests/official-data.test.mjs
      - name: Commit all matching catalog and group snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/official-schedule.json src/data/official-timacad-feed.json public/data docs/evidence/schedule-sync.json
          if ! git diff --staged --quiet; then
            git commit -m 'data: refresh verified official schedule snapshots'
            git push
          fi
  publish:
    needs: sync
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
