name: Timiryazevka Daily Schedule Sync

on:
  schedule:
    # 04:00 AM MSK = 01:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-schedule:
    name: Sync Official Schedule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Timacad Sync Engine
        run: node scripts/sync-schedule.mjs

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "Студенческий совет РГАУ-МСХА"
          git config --global user.email "studsovet@timacad.ru"
          git add src/data/official-schedule.json public/data/official-schedule.json
          if git diff --staged --quiet; then
            echo "No schedule changes detected."
          else
            git commit -m "chore(schedule): daily sync with official Timacad schedule [04:00 MSK]"
            git push
          fi
