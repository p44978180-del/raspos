name: ios

on:
  workflow_dispatch:
  push:
    paths:
      - platform/rust/timacad-core/**
      - platform/mobile/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - platform/rust/timacad-core/**
      - platform/mobile/**
      - .github/workflows/ios.yml

jobs:
  widgetkit:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile SharedCore.xcframework and the WidgetKit target
        run: bash platform/mobile/ios-extensions/build-widget.sh

  iosApp:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform 36
        run: sdkmanager --install "platforms;android-36"
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile :iosApp
        working-directory: platform/mobile
        run: chmod +x gradlew && ./gradlew :iosApp:compileIosApp --stacktrace
