services:
  postgres:
    image: postgres:16-alpine
    container_name: timacad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: timacad_schedule
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timacad_schedule"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: timacad_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: timacad_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/timacad_schedule?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      PYTHON_BIN: "python3"
      PARSER_SCRIPT_PATH: "/app/scripts/timacad_parser.py"
      SCHEDULE_DATA_PATH: "/app/public/data/official-schedule.json"
      AUTO_SEED: "true"
    volumes:
      - ../scripts:/app/scripts:ro
      - ../public/data:/app/public/data
      - ../downloads:/app/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
