[package]
name = "timacad-rust-core"
version = "3.0.1"
edition = "2021"
authors = ["RGAU-MSHA Engineering Team"]
description = "High-performance zero-alloc Rust shared core with Wasm SIMD 128 for Timacad RasPOS v3.0.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
