[package]
name = "timacad-rust-core"
version = "3.0.0"
edition = "2021"
authors = ["RGAU-MSHA Engineering Team"]
description = "High-performance zero-alloc Rust shared core for Timacad RasPOS v3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Note: wasm-bindgen and serde for browser WASM compilation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
